<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1524"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Glow blob top-right -->
  <ellipse cx="950" cy="200" rx="360" ry="260" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#3b82f6"/>

  <!-- Top decorative line -->
  <line x1="6" y1="80" x2="1200" y2="80" stroke="#334155" stroke-width="1"/>

  <!-- Terminal dots row (top-left) -->
  <circle cx="34" cy="42" r="8" fill="#ef4444" opacity="0.8"/>
  <circle cx="60" cy="42" r="8" fill="#f59e0b" opacity="0.8"/>
  <circle cx="86" cy="42" r="8" fill="#22c55e" opacity="0.8"/>

  <!-- Site label (top right) -->
  <text x="1160" y="50" font-family="monospace" font-size="18" fill="#94a3b8" text-anchor="end">anivaryam.github.io</text>

  <!-- Category badge -->
  <rect x="60" y="130" width="116" height="36" rx="18" fill="#3b82f622" stroke="#3b82f655" stroke-width="1"/>
  <text x="118" y="154" font-family="monospace" font-size="15" font-weight="600" fill="#3b82f6" text-anchor="middle">Tutorial</text>

  <!-- Tool name -->
  <text x="60" y="230" font-family="system-ui,sans-serif" font-size="72" font-weight="bold" fill="#f1f5f9">Word to HTML</text>
  <text x="60" y="312" font-family="system-ui,sans-serif" font-size="72" font-weight="bold" fill="#f1f5f9">Converter</text>

  <!-- Tagline -->
  <text x="60" y="360" font-family="system-ui,sans-serif" font-size="26" font-weight="normal" fill="#94a3b8">Convert Word documents to clean, SEO-ready</text>
  <text x="60" y="396" font-family="system-ui,sans-serif" font-size="26" font-weight="normal" fill="#94a3b8">HTML without the mess.</text>

  <!-- Bottom border -->
  <line x1="6" y1="550" x2="1200" y2="550" stroke="#334155" stroke-width="1"/>

  <!-- Bottom label -->
  <text x="60" y="588" font-family="monospace" font-size="16" fill="#94a3b8">Free · Browser-based · No signup</text>

  <!-- Icon area (right side) -->
  <g transform="translate(780, 140)">
    <!-- Document -->
    <rect x="20" y="20" width="180" height="220" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="40" y="50" width="140" height="10" rx="5" fill="#3b82f6" opacity="0.7"/>
    <rect x="40" y="72" width="110" height="8" rx="4" fill="#334155"/>
    <rect x="40" y="90" width="130" height="8" rx="4" fill="#334155"/>
    <rect x="40" y="108" width="90" height="8" rx="4" fill="#334155"/>
    <rect x="40" y="140" width="140" height="8" rx="4" fill="#334155"/>
    <rect x="40" y="158" width="120" height="8" rx="4" fill="#334155"/>
    <!-- Arrow -->
    <path d="M220 130 L270 130" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
    <path d="M258 118 L272 130 L258 142" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- HTML block -->
    <rect x="280" y="60" width="180" height="150" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="295" y="100" font-family="monospace" font-size="14" fill="#60a5fa">&lt;h1&gt;</text>
    <text x="295" y="120" font-family="monospace" font-size="13" fill="#94a3b8">  Clean HTML</text>
    <text x="295" y="140" font-family="monospace" font-size="14" fill="#60a5fa">&lt;/h1&gt;</text>
    <text x="295" y="162" font-family="monospace" font-size="14" fill="#60a5fa">&lt;p&gt;...&lt;/p&gt;</text></g>
</svg>