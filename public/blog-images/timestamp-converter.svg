<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1524"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Glow blob top-right -->
  <ellipse cx="950" cy="200" rx="360" ry="260" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#3b82f6"/>

  <!-- Top decorative line -->
  <line x1="6" y1="80" x2="1200" y2="80" stroke="#334155" stroke-width="1"/>

  <!-- Terminal dots row (top-left) -->
  <circle cx="34" cy="42" r="8" fill="#ef4444" opacity="0.8"/>
  <circle cx="60" cy="42" r="8" fill="#f59e0b" opacity="0.8"/>
  <circle cx="86" cy="42" r="8" fill="#22c55e" opacity="0.8"/>

  <!-- Site label (top right) -->
  <text x="1160" y="50" font-family="monospace" font-size="18" fill="#94a3b8" text-anchor="end">anivaryam.github.io</text>

  <!-- Category badge -->
  <rect x="60" y="130" width="72" height="36" rx="18" fill="#3b82f622" stroke="#3b82f655" stroke-width="1"/>
  <text x="96" y="154" font-family="monospace" font-size="15" font-weight="600" fill="#3b82f6" text-anchor="middle">Tool</text>

  <!-- Tool name -->
  <text x="60" y="230" font-family="system-ui,sans-serif" font-size="72" font-weight="bold" fill="#f1f5f9">Timestamp</text>
  <text x="60" y="312" font-family="system-ui,sans-serif" font-size="72" font-weight="bold" fill="#f1f5f9">Converter</text>

  <!-- Tagline -->
  <text x="60" y="360" font-family="system-ui,sans-serif" font-size="26" font-weight="normal" fill="#94a3b8">Convert Unix timestamps to human-readable</text>
  <text x="60" y="396" font-family="system-ui,sans-serif" font-size="26" font-weight="normal" fill="#94a3b8">dates and back.</text>

  <!-- Bottom border -->
  <line x1="6" y1="550" x2="1200" y2="550" stroke="#334155" stroke-width="1"/>

  <!-- Bottom label -->
  <text x="60" y="588" font-family="monospace" font-size="16" fill="#94a3b8">Free · Browser-based · No signup</text>

  <!-- Icon area (right side) -->
  <g transform="translate(780, 140)">
    <!-- Clock face -->
    <circle cx="190" cy="170" r="130" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <circle cx="190" cy="170" r="120" fill="#0f172a"/>
    <!-- Clock markings -->
    <line x1="190" y1="58" x2="190" y2="78" stroke="#334155" stroke-width="3"/>
    <line x1="190" y1="262" x2="190" y2="282" stroke="#334155" stroke-width="3"/>
    <line x1="78" y1="170" x2="98" y2="170" stroke="#334155" stroke-width="3"/>
    <line x1="282" y1="170" x2="302" y2="170" stroke="#334155" stroke-width="3"/>
    <!-- Clock hands -->
    <line x1="190" y1="170" x2="190" y2="100" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>
    <line x1="190" y1="170" x2="240" y2="200" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
    <circle cx="190" cy="170" r="8" fill="#3b82f6"/>
    <!-- Unix timestamp -->
    <rect x="30" y="330" width="300" height="40" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="180" y="356" font-family="monospace" font-size="15" fill="#60a5fa" text-anchor="middle">1735689600</text></g>
</svg>