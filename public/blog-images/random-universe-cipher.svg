<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1524"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Glow blob top-right -->
  <ellipse cx="950" cy="200" rx="360" ry="260" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#8b5cf6"/>

  <!-- Top decorative line -->
  <line x1="6" y1="80" x2="1200" y2="80" stroke="#334155" stroke-width="1"/>

  <!-- Terminal dots row (top-left) -->
  <circle cx="34" cy="42" r="8" fill="#ef4444" opacity="0.8"/>
  <circle cx="60" cy="42" r="8" fill="#f59e0b" opacity="0.8"/>
  <circle cx="86" cy="42" r="8" fill="#22c55e" opacity="0.8"/>

  <!-- Site label (top right) -->
  <text x="1160" y="50" font-family="monospace" font-size="18" fill="#94a3b8" text-anchor="end">anivaryam.github.io</text>

  <!-- Category badge -->
  <rect x="60" y="130" width="116" height="36" rx="18" fill="#8b5cf622" stroke="#8b5cf655" stroke-width="1"/>
  <text x="118" y="154" font-family="monospace" font-size="15" font-weight="600" fill="#8b5cf6" text-anchor="middle">Security</text>

  <!-- Tool name -->
  <text x="60" y="230" font-family="system-ui,sans-serif" font-size="72" font-weight="bold" fill="#f1f5f9">Random Universe</text>
  <text x="60" y="312" font-family="system-ui,sans-serif" font-size="72" font-weight="bold" fill="#f1f5f9">Cipher</text>

  <!-- Tagline -->
  <text x="60" y="360" font-family="system-ui,sans-serif" font-size="26" font-weight="normal" fill="#94a3b8">256-bit post-quantum symmetric cipher with</text>
  <text x="60" y="396" font-family="system-ui,sans-serif" font-size="26" font-weight="normal" fill="#94a3b8">Argon2id key derivation.</text>

  <!-- Bottom border -->
  <line x1="6" y1="550" x2="1200" y2="550" stroke="#334155" stroke-width="1"/>

  <!-- Bottom label -->
  <text x="60" y="588" font-family="monospace" font-size="16" fill="#94a3b8">Free · Browser-based · No signup</text>

  <!-- Icon area (right side) -->
  <g transform="translate(780, 140)">
    <!-- Lock body -->
    <rect x="80" y="160" width="200" height="170" rx="20" fill="#1e293b" stroke="#8b5cf6" stroke-width="3"/>
    <!-- Lock shackle -->
    <path d="M110 160 L110 100 Q180 40 250 100 L250 160" stroke="#8b5cf6" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="180" cy="240" r="24" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="170" y="252" width="20" height="36" rx="4" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
    <!-- Binary around lock -->
    <text x="10" y="100" font-family="monospace" font-size="13" fill="#8b5cf6" opacity="0.4">10110101</text>
    <text x="280" y="200" font-family="monospace" font-size="13" fill="#8b5cf6" opacity="0.4">01001110</text>
    <text x="20" y="300" font-family="monospace" font-size="13" fill="#8b5cf6" opacity="0.4">11010010</text>
    <text x="270" y="320" font-family="monospace" font-size="13" fill="#8b5cf6" opacity="0.3">00111010</text></g>
</svg>