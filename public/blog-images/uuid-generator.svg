<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1524"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Glow blob top-right -->
  <ellipse cx="950" cy="200" rx="360" ry="260" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#f59e0b"/>

  <!-- Top decorative line -->
  <line x1="6" y1="80" x2="1200" y2="80" stroke="#334155" stroke-width="1"/>

  <!-- Terminal dots row (top-left) -->
  <circle cx="34" cy="42" r="8" fill="#ef4444" opacity="0.8"/>
  <circle cx="60" cy="42" r="8" fill="#f59e0b" opacity="0.8"/>
  <circle cx="86" cy="42" r="8" fill="#22c55e" opacity="0.8"/>

  <!-- Site label (top right) -->
  <text x="1160" y="50" font-family="monospace" font-size="18" fill="#94a3b8" text-anchor="end">anivaryam.github.io</text>

  <!-- Category badge -->
  <rect x="60" y="130" width="72" height="36" rx="18" fill="#f59e0b22" stroke="#f59e0b55" stroke-width="1"/>
  <text x="96" y="154" font-family="monospace" font-size="15" font-weight="600" fill="#f59e0b" text-anchor="middle">Tool</text>

  <!-- Tool name -->
  <text x="60" y="230" font-family="system-ui,sans-serif" font-size="72" font-weight="bold" fill="#f1f5f9">UUID Generator</text>

  <!-- Tagline -->
  <text x="60" y="360" font-family="system-ui,sans-serif" font-size="26" font-weight="normal" fill="#94a3b8">Generate RFC-4122 UUIDs v1, v3, v4, and v5</text>
  <text x="60" y="396" font-family="system-ui,sans-serif" font-size="26" font-weight="normal" fill="#94a3b8">in bulk.</text>

  <!-- Bottom border -->
  <line x1="6" y1="550" x2="1200" y2="550" stroke="#334155" stroke-width="1"/>

  <!-- Bottom label -->
  <text x="60" y="588" font-family="monospace" font-size="16" fill="#94a3b8">Free · Browser-based · No signup</text>

  <!-- Icon area (right side) -->
  <g transform="translate(780, 140)">
    <!-- UUID display -->
    <rect x="10" y="100" width="360" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="30" y="140" font-family="monospace" font-size="14" fill="#60a5fa">550e8400-e29b</text>
    <text x="30" y="162" font-family="monospace" font-size="14" fill="#60a5fa">-41d4-a716-446655</text>
    <!-- Generate button -->
    <rect x="90" y="220" width="180" height="50" rx="10" fill="#3b82f6"/>
    <text x="180" y="251" font-family="monospace" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Generate</text>
    <!-- Random sparks -->
    <path d="M30 290 L50 310 L30 330" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M310 290 L330 310 L310 330" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="180" cy="320" r="8" fill="#f59e0b" opacity="0.4"/>
    <circle cx="80" cy="370" r="5" fill="#60a5fa" opacity="0.4"/>
    <circle cx="280" cy="370" r="5" fill="#60a5fa" opacity="0.4"/></g>
</svg>