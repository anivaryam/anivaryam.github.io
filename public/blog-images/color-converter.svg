<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1524"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Glow blob top-right -->
  <ellipse cx="950" cy="200" rx="360" ry="260" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#ec4899"/>

  <!-- Top decorative line -->
  <line x1="6" y1="80" x2="1200" y2="80" stroke="#334155" stroke-width="1"/>

  <!-- Terminal dots row (top-left) -->
  <circle cx="34" cy="42" r="8" fill="#ef4444" opacity="0.8"/>
  <circle cx="60" cy="42" r="8" fill="#f59e0b" opacity="0.8"/>
  <circle cx="86" cy="42" r="8" fill="#22c55e" opacity="0.8"/>

  <!-- Site label (top right) -->
  <text x="1160" y="50" font-family="monospace" font-size="18" fill="#94a3b8" text-anchor="end">anivaryam.github.io</text>

  <!-- Category badge -->
  <rect x="60" y="130" width="72" height="36" rx="18" fill="#ec489922" stroke="#ec489955" stroke-width="1"/>
  <text x="96" y="154" font-family="monospace" font-size="15" font-weight="600" fill="#ec4899" text-anchor="middle">Tool</text>

  <!-- Tool name -->
  <text x="60" y="230" font-family="system-ui,sans-serif" font-size="72" font-weight="bold" fill="#f1f5f9">Color Converter</text>

  <!-- Tagline -->
  <text x="60" y="360" font-family="system-ui,sans-serif" font-size="26" font-weight="normal" fill="#94a3b8">Convert colors between HEX, RGB, HSL, and</text>
  <text x="60" y="396" font-family="system-ui,sans-serif" font-size="26" font-weight="normal" fill="#94a3b8">more formats.</text>

  <!-- Bottom border -->
  <line x1="6" y1="550" x2="1200" y2="550" stroke="#334155" stroke-width="1"/>

  <!-- Bottom label -->
  <text x="60" y="588" font-family="monospace" font-size="16" fill="#94a3b8">Free · Browser-based · No signup</text>

  <!-- Icon area (right side) -->
  <g transform="translate(780, 140)">
    <!-- Color wheel simplified -->
    <circle cx="190" cy="190" r="130" fill="none" stroke="#334155" stroke-width="2"/>
    <!-- Colored segments -->
    <path d="M190 190 L320 190 A130 130 0 0 0 255 80 Z" fill="#ef4444" opacity="0.8"/>
    <path d="M190 190 L255 80 A130 130 0 0 0 125 80 Z" fill="#f59e0b" opacity="0.8"/>
    <path d="M190 190 L125 80 A130 130 0 0 0 60 190 Z" fill="#22c55e" opacity="0.8"/>
    <path d="M190 190 L60 190 A130 130 0 0 0 125 300 Z" fill="#3b82f6" opacity="0.8"/>
    <path d="M190 190 L125 300 A130 130 0 0 0 255 300 Z" fill="#8b5cf6" opacity="0.8"/>
    <path d="M190 190 L255 300 A130 130 0 0 0 320 190 Z" fill="#ec4899" opacity="0.8"/>
    <circle cx="190" cy="190" r="50" fill="#0f172a"/>
    <!-- HEX label -->
    <text x="190" y="196" font-family="monospace" font-size="14" fill="#f1f5f9" text-anchor="middle">#3B82F6</text></g>
</svg>