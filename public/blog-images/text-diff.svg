<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1524"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Glow blob top-right -->
  <ellipse cx="950" cy="200" rx="360" ry="260" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#22c55e"/>

  <!-- Top decorative line -->
  <line x1="6" y1="80" x2="1200" y2="80" stroke="#334155" stroke-width="1"/>

  <!-- Terminal dots row (top-left) -->
  <circle cx="34" cy="42" r="8" fill="#ef4444" opacity="0.8"/>
  <circle cx="60" cy="42" r="8" fill="#f59e0b" opacity="0.8"/>
  <circle cx="86" cy="42" r="8" fill="#22c55e" opacity="0.8"/>

  <!-- Site label (top right) -->
  <text x="1160" y="50" font-family="monospace" font-size="18" fill="#94a3b8" text-anchor="end">anivaryam.github.io</text>

  <!-- Category badge -->
  <rect x="60" y="130" width="72" height="36" rx="18" fill="#22c55e22" stroke="#22c55e55" stroke-width="1"/>
  <text x="96" y="154" font-family="monospace" font-size="15" font-weight="600" fill="#22c55e" text-anchor="middle">Tool</text>

  <!-- Tool name -->
  <text x="60" y="230" font-family="system-ui,sans-serif" font-size="72" font-weight="bold" fill="#f1f5f9">Text Diff Tool</text>

  <!-- Tagline -->
  <text x="60" y="360" font-family="system-ui,sans-serif" font-size="26" font-weight="normal" fill="#94a3b8">Compare two blocks of text and see exactly</text>
  <text x="60" y="396" font-family="system-ui,sans-serif" font-size="26" font-weight="normal" fill="#94a3b8">what changed.</text>

  <!-- Bottom border -->
  <line x1="6" y1="550" x2="1200" y2="550" stroke="#334155" stroke-width="1"/>

  <!-- Bottom label -->
  <text x="60" y="588" font-family="monospace" font-size="16" fill="#94a3b8">Free · Browser-based · No signup</text>

  <!-- Icon area (right side) -->
  <g transform="translate(780, 140)">
    <!-- Left text (old) -->
    <rect x="10" y="60" width="160" height="200" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="26" y="90" font-family="monospace" font-size="13" fill="#94a3b8">Hello world.</text>
    <rect x="26" y="100" width="140" height="22" rx="4" fill="#ef4444" opacity="0.2"/>
    <text x="26" y="116" font-family="monospace" font-size="13" fill="#ef4444">Old line here</text>
    <text x="26" y="140" font-family="monospace" font-size="13" fill="#94a3b8">Unchanged.</text>
    <text x="26" y="162" font-family="monospace" font-size="13" fill="#94a3b8">More text.</text>
    <!-- Diff arrow -->
    <text x="183" y="168" font-family="monospace" font-size="28" fill="#60a5fa">⟷</text>
    <!-- Right text (new) -->
    <rect x="210" y="60" width="160" height="200" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="226" y="90" font-family="monospace" font-size="13" fill="#94a3b8">Hello world.</text>
    <rect x="226" y="100" width="140" height="22" rx="4" fill="#22c55e" opacity="0.2"/>
    <text x="226" y="116" font-family="monospace" font-size="13" fill="#4ade80">New line here</text>
    <text x="226" y="140" font-family="monospace" font-size="13" fill="#94a3b8">Unchanged.</text>
    <text x="226" y="162" font-family="monospace" font-size="13" fill="#94a3b8">More text.</text></g>
</svg>