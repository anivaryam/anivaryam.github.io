<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1524"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#334155" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Glow blob top-right -->
  <ellipse cx="950" cy="200" rx="360" ry="260" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#0f172a"/>

  <!-- Top decorative line -->
  <line x1="6" y1="80" x2="1200" y2="80" stroke="#334155" stroke-width="1"/>

  <!-- Terminal dots row (top-left) -->
  <circle cx="34" cy="42" r="8" fill="#ef4444" opacity="0.8"/>
  <circle cx="60" cy="42" r="8" fill="#f59e0b" opacity="0.8"/>
  <circle cx="86" cy="42" r="8" fill="#22c55e" opacity="0.8"/>

  <!-- Site label (top right) -->
  <text x="1160" y="50" font-family="monospace" font-size="18" fill="#94a3b8" text-anchor="end">anivaryam.github.io</text>

  <!-- Category badge -->
  <rect x="60" y="130" width="72" height="36" rx="18" fill="#0f172a22" stroke="#0f172a55" stroke-width="1"/>
  <text x="96" y="154" font-family="monospace" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Tool</text>

  <!-- Tool name -->
  <text x="60" y="230" font-family="system-ui,sans-serif" font-size="72" font-weight="bold" fill="#f1f5f9">QR Code</text>
  <text x="60" y="312" font-family="system-ui,sans-serif" font-size="72" font-weight="bold" fill="#f1f5f9">Generator</text>

  <!-- Tagline -->
  <text x="60" y="360" font-family="system-ui,sans-serif" font-size="26" font-weight="normal" fill="#94a3b8">Generate customizable QR codes for URLs,</text>
  <text x="60" y="396" font-family="system-ui,sans-serif" font-size="26" font-weight="normal" fill="#94a3b8">text, contacts, and more.</text>

  <!-- Bottom border -->
  <line x1="6" y1="550" x2="1200" y2="550" stroke="#334155" stroke-width="1"/>

  <!-- Bottom label -->
  <text x="60" y="588" font-family="monospace" font-size="16" fill="#94a3b8">Free · Browser-based · No signup</text>

  <!-- Icon area (right side) -->
  <g transform="translate(780, 140)">
    <!-- QR code pattern -->
    <rect x="70" y="40" width="230" height="230" rx="12" fill="#f1f5f9"/>
    <!-- Corner squares -->
    <rect x="86" y="56" width="60" height="60" rx="6" fill="#0f172a"/>
    <rect x="94" y="64" width="44" height="44" rx="4" fill="#f1f5f9"/>
    <rect x="102" y="72" width="28" height="28" rx="2" fill="#0f172a"/>
    <rect x="224" y="56" width="60" height="60" rx="6" fill="#0f172a"/>
    <rect x="232" y="64" width="44" height="44" rx="4" fill="#f1f5f9"/>
    <rect x="240" y="72" width="28" height="28" rx="2" fill="#0f172a"/>
    <rect x="86" y="194" width="60" height="60" rx="6" fill="#0f172a"/>
    <rect x="94" y="202" width="44" height="44" rx="4" fill="#f1f5f9"/>
    <rect x="102" y="210" width="28" height="28" rx="2" fill="#0f172a"/>
    <!-- Data modules (simplified) -->
    <rect x="162" y="56" width="52" height="8" rx="2" fill="#0f172a"/>
    <rect x="162" y="72" width="26" height="8" rx="2" fill="#0f172a"/>
    <rect x="196" y="72" width="18" height="8" rx="2" fill="#0f172a"/>
    <rect x="162" y="88" width="52" height="8" rx="2" fill="#0f172a"/>
    <rect x="86" y="130" width="26" height="8" rx="2" fill="#0f172a"/>
    <rect x="120" y="130" width="18" height="8" rx="2" fill="#0f172a"/>
    <rect x="162" y="130" width="52" height="8" rx="2" fill="#0f172a"/>
    <rect x="86" y="148" width="44" height="8" rx="2" fill="#0f172a"/>
    <rect x="162" y="148" width="26" height="8" rx="2" fill="#0f172a"/>
    <rect x="196" y="148" width="18" height="8" rx="2" fill="#0f172a"/>
    <!-- URL below -->
    <text x="185" y="310" font-family="monospace" font-size="13" fill="#60a5fa" text-anchor="middle">https://anivaryam.github.io</text></g>
</svg>